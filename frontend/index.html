<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Point to manifest correctly -->
    <link rel="manifest" href="./manifest.json" />

    <!-- Favicon from public folder -->
    <link rel="icon" type="image/svg+xml" href="./public/icon.svg" />
    <!-- ensure the "hidden" class works immediately -->
  <style>.hidden { display: none !important; }</style>

    <meta name="theme-color" content="#184551" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fair Fare</title>

    <!-- Optional: Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z1QKE3M5CQ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-Z1QKE3M5CQ");
    </script>
  </head>
  <body class="relative">
    <div id="root"></div>

    <!-- INSTALL POPUP MODAL -->
    <div
      id="installModal"
      class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50"
    >
      <div
        class="bg-white/5 backdrop-blur-lg border border-white/10 rounded-2xl p-8 w-11/12 max-w-sm text-center"
      >
        <h2
          class="text-2xl font-semibold bg-clip-text text-transparent bg-gradient-to-r from-white to-blue-400 mb-4"
        >
          Install FairFare?
        </h2>
        <p class="text-gray-400 mb-6">
          Add FairFare to your home screen for quick access.
        </p>
        <div class="flex justify-center gap-4">
          <button
            id="cancelInstall"
            class="bg-transparent border text-white border-white/30 py-2 px-4 rounded-lg hover:bg-white/10 transition-all duration-300"
          >
            No Thanks
          </button>
          <button
            id="confirmInstall"
            class="bg-blue-600/80 backdrop-blur-sm text-white py-2 px-4 rounded-lg hover:bg-blue-700/80 transition-all duration-300 border border-blue-400/30"
          >
            Install
          </button>
        </div>
      </div>
    </div>

    <!-- Your app entry -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- PWA Install Logic -->
    <script>
      let deferredPrompt;
      const modal = document.getElementById("installModal");
      const confirmBtn = document.getElementById("confirmInstall");
      const cancelBtn = document.getElementById("cancelInstall");

      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
        modal.classList.remove("hidden");
      });

      confirmBtn.addEventListener("click", async () => {
        modal.classList.add("hidden");
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log("PWA install outcome:", outcome);
        deferredPrompt = null;
      });

      cancelBtn.addEventListener("click", () => {
        modal.classList.add("hidden");
      });

      // Optional: hide modal when clicking backdrop
      modal.addEventListener("click", (e) => {
        if (e.target === modal) modal.classList.add("hidden");
      });
    </script>
  </body>
</html>
